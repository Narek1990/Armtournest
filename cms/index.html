<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="ArmTourNest content management">
<meta name="theme-color" content="#102a3e">
<script>
/* Strip ChatGPT attribution from the visible URL while preserving CMS routes. */
(()=>{try{
  const u=new URL(location.href);
  if((u.searchParams.get('utm_source')||'').toLowerCase()==='chatgpt.com'){
    u.searchParams.delete('utm_source');
    history.replaceState(history.state,'',u.pathname+u.search+u.hash);
  }
}catch(_){}})();
</script>
<title>ArmTourNest — Content Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app"><main class="boot"><div class="spinner"></div><strong>Opening ArmTourNest Content Studio…</strong></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
