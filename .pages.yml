media:
  input: media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp]
  categories:
  - image
content:
- name: website
  label: Website settings & contacts
  type: file
  path: content/site.json
  format: json
  fields:
  - name: brand
    label: Brand identity
    type: object
    fields:
    - name: name
      label: Company name
      type: string
    - name: tagline
      label: Brand slogan
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: ru
        label: Русский
        type: string
      - name: hy
        label: Հայերեն
        type: string
    - name: logo
      label: Upload brand logo (transparent PNG or WebP)
      type: image
      description: "JPG, PNG or WebP only. Upload max 8 MiB and 8192 px per side / 36 MP. Publishing compresses to 800x800 px / 150 KiB. Use landscape photos for tour/car covers."
      options:
        extensions: [jpg, jpeg, png, webp]
  - name: navigation
    label: Navigation order
    type: string
    list: true
  - name: contacts
    label: Contact & social channels
    type: object
    fields:
    - name: phone
      label: Public phone number
      type: string
    - name: whatsapp
      label: WhatsApp phone digits (without +)
      type: string
    - name: email
      label: Public email
      type: string
    - name: address
      label: Address
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: ru
        label: Русский
        type: string
      - name: hy
        label: Հայերեն
        type: string
    - name: social
      label: Social profile links
      type: object
      fields:
      - name: facebook
        label: Facebook URL
        type: string
      - name: instagram
        label: Instagram URL
        type: string
  - name: settings
    label: Site configuration
    type: object
    fields:
    - name: defaultLanguage
      label: Default language
      type: select
      options:
        values:
        - en
        - ru
        - hy
    - name: languages
      label: Published languages
      type: string
      list: true
    - name: defaultCurrency
      label: Currency
      type: select
      options:
        values:
        - AMD
    - name: currencyOptions
      label: Supported currencies
      type: string
      list: true
    - name: bookingMode
      label: Booking mode
      type: select
      options:
        values:
        - enquiry
    - name: demoPrices
      label: Display disclaimer for sample prices
      type: boolean
    - name: timezone
      label: Timezone
      type: string
- name: tour-catalogue
  label: Tours — add / edit / publish
  type: collection
  path: content/tours
  format: json
  filename: '{id}.json'
  view:
    primary: id
    fields:
    - id
    - status
    - featured
    - pricing.from
    search:
    - id
    - name.en
    sort:
    - id
  fields:
  - name: id
    label: Unique slug (lowercase, no spaces)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: slug
    label: Public slug
    type: string
  - name: status
    label: Publication status
    type: select
    options:
      values:
      - published
      - draft
      - archived
  - name: featured
    label: Feature on homepage
    type: boolean
  - name: category
    label: Tour type
    type: select
    options:
      values:
      - group
      - private
      - outgoing
  - name: destination
    label: Destination code
    type: string
  - name: image
    label: Cover image
    type: image
    description: "JPG, PNG or WebP only. Upload max 8 MiB and 8192 px per side / 36 MP. Publishing compresses to 1600x1100 px / 450 KiB. Use landscape photos for tour/car covers."
    options:
      extensions: [jpg, jpeg, png, webp]
  - name: gallery
    label: Tour gallery
    type: image
    description: "JPG, PNG or WebP only. Upload max 8 MiB and 8192 px per side / 36 MP. Publishing compresses to 1600x1100 px / 450 KiB. Use landscape photos for tour/car covers."
    options:
      extensions: [jpg, jpeg, png, webp]
      multiple:
        max: 12
  - name: name
    label: Tour title
    type: object
    fields:
    - name: en
      label: English
      type: string
    - name: ru
      label: Русский
      type: string
    - name: hy
      label: Հայերեն
      type: string
  - name: summary
    label: Description
    type: object
    fields:
    - name: en
      label: English
      type: text
    - name: ru
      label: Русский
      type: text
    - name: hy
      label: Հայերեն
      type: text
  - name: itinerary
    label: Itinerary stops
    type: object
    list: true
    fields:
    - name: order
      label: Order
      type: number
    - name: title
      label: Stop title
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: ru
        label: Русский
        type: string
      - name: hy
        label: Հայերեն
        type: string
  - name: pricing
    label: Tour pricing
    type: object
    fields:
    - name: currency
      label: Currency
      type: select
      options:
        values:
        - AMD
        - USD
        - EUR
    - name: from
      label: Starting price (per unit)
      type: number
    - name: unit
      label: Price per
      type: select
      options:
        values:
        - person
        - group
    - name: isIndicative
      label: Illustrative price (turn off when real)
      type: boolean
  - name: durationHours
    label: Duration in hours
    type: number
  - name: departureCity
    label: Departure city
    type: string
  - name: languages
    label: Guide languages
    type: select
    options:
      values:
      - en
      - ru
      - hy
      multiple: true
  - name: included
    label: Included items
    type: object
    list: true
    fields:
    - name: en
      label: English
      type: string
    - name: ru
      label: Русский
      type: string
    - name: hy
      label: Հայերեն
      type: string
  - name: excluded
    label: Excluded items
    type: object
    list: true
    fields:
    - name: en
      label: English
      type: string
    - name: ru
      label: Русский
      type: string
    - name: hy
      label: Հայերեն
      type: string
  - name: seo
    label: SEO metadata
    type: object
    fields:
    - name: title
      label: SEO title
      type: object
      fields:
      - name: en
        label: English
        type: string
      - name: ru
        label: Русский
        type: string
      - name: hy
        label: Հայերեն
        type: string
    - name: description
      label: SEO description
      type: object
      fields:
      - name: en
        label: English
        type: text
      - name: ru
        label: Русский
        type: text
      - name: hy
        label: Հայերեն
        type: text
